services:
  postgres:
    image: postgres:latest
    container_name: postgres_health_manager
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teste}
      POSTGRES_DB: ${DB_NAME:-health-manager-db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health-manager-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teste}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-health-manager-db}
      DB_USER: ${DB_USER:-postgres}
    ports:
      - '8080:8080'

  redis:
    container_name: redis-health-manager
    image: redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - '6379:6379'

volumes:
  postgres_data:
